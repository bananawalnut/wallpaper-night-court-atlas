name: Build publisher bundle

on:
  workflow_dispatch:
    inputs:
      publish_channel:
        description: Build only or publish through the Zenith admin API
        required: true
        default: build-only
        type: choice
        options:
          - build-only
          - staging
          - production
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  bundle:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run release
      - uses: actions/upload-artifact@v4
        with:
          name: wallpaper-publisher-bundle
          path: |
            dist/publication.json
            dist/pack.zip
            dist/preview.*
            dist/release-summary.json
          if-no-files-found: error
      - name: Publish signed release
        if: github.event_name == 'workflow_dispatch' && inputs.publish_channel != 'build-only'
        run: node scripts/publish.mjs --channel "${{ inputs.publish_channel }}"
        env:
          ZENITH_PUBLISH_ORIGIN: https://zenith-research.ca
